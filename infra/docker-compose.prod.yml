services:
  web:
    image: ghcr.io/malikstudent/tokokita_tes:latest
    container_name: tokokita_web_prod
    env_file:
      - ../.env
    depends_on:
      - db
    networks:
      - tokonet_prod

  db:
    image: postgres:15
    container_name: tokokita_db_prod
    restart: unless-stopped
    env_file:
      - ../.env
    volumes:
      - dbdata_prod:/var/lib/postgresql/data
    networks:
      - tokonet_prod

  nginx:
    image: nginx:latest
    container_name: tokokita_nginx_prod
    ports:
      - "127.0.0.1:3001:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - tokonet_prod

networks:
  tokonet_prod:

volumes:
  dbdata_prod: