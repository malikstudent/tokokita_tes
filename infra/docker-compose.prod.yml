services:
  web:
    image: ghcr.io/malikstudent/tokokita_tes@${IMAGE_DIGEST}
    container_name: tokokita_web_prod
    env_file:
      - /etc/tokokita/prod.env
    depends_on:
      - db
    networks:
      - tokonet

  db:
    image: postgres:15
    container_name: tokokita_db_prod
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - dbdata_prod:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks:
      - tokonet

  nginx:
    image: nginx:latest
    container_name: tokokita_nginx_prod
    ports:
      - "127.0.0.1:3003:80"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - tokonet

networks:
  tokonet:

volumes:
  dbdata_prod:
