version: '3.9'

services:
  web:
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    container_name: tokokita_web_prod
    env_file: ./app/.env
    depends_on:
      - db
    networks:
      - tokonet

  db:
    image: postgres:15
    container_name: tokokita_db_prod
    restart: always
    environment:
      POSTGRES_DB: tokokita
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - dbdata_prod:/var/lib/postgresql/data
    networks:
      - tokonet

  nginx:
    image: nginx:latest
    container_name: tokokita_nginx_prod
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - tokonet

networks:
  tokonet:

volumes:
  dbdata_prod:
