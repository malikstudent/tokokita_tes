version: '3.9'

services:
  web:
    build: ./app
    container_name: tokokita_web
    env_file: ./app/.env.example
    depends_on:
      - db
    networks:
      - tokonet

  db:
    image: postgres:15
    container_name: tokokita_db
    restart: always
    environment:
      POSTGRES_DB: tokokita
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
    volumes:
      - dbdata_staging:/var/lib/postgresql/data
    networks:
      - tokonet

  nginx:
    image: nginx:latest
    container_name: tokokita_nginx
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - web
    networks:
      - tokonet

networks:
  tokonet:

volumes:
  dbdata_staging:
